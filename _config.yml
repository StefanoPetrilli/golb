# Example Site settings

url: "https://stefano.petrilli.xyz"
title: "Stefano Petrilli"

header_pages:
  - index.md
  - about.md

footer: 'Did you like it? Let me know at stefano [at] petrilli.xyz or connect with me on <a href="https://www.linkedin.com/in/stefanoperilli">LinkedIn</a>'

plugins:
  - jekyll-seo-tag
  - jekyll-feed

# RSS/Atom feed (/feed.xml): publish only each post's excerpt, not the full text
feed:
  excerpt_only: true

# Theme
# Single built-in style: Noctis Bordo-inspired dark palette

# Fonts
# disable_google_fonts: false # set true to prevent loading fonts.googleapis.com

# Tracking (generic, optional; loads only in production)
# tracking:
#   script_src:
#     - https://analytics.example.com/matomo.js
#   async: true   # default true
#   defer: false  # default false
#   # Optional inline init snippet (requires CSP allowance if used)
